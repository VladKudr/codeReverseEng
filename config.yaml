# Конфигурация прогона req-reverse v3.
# Все пути — относительно каталога этого файла (или абсолютные).

repo:
  path: ../subject          # {REPO_PATH} — корень анализируемого репозитория
  name: sqlite-utils        # {REPO_NAME} — префикс идентификаторов правил

workspace: workspace        # {WS} — каталог артефактов прогона

agent:
  # Команда вызова ВАШЕГО CLI-агента. Комплект не привязан ни к какому
  # инструменту: runner знает только шаблон команды и код возврата.
  # Контракт агента: работает без интерактива, сам пишет артефакт по пути
  # из промпта, завершается с кодом 0. Примеры под конкретные CLI
  # (Qwen Code, Kimi и др.) — prompts/RUNBOOK.md, раздел «Настройка CLI-агента».
  #
  # Подстановки (по-токенно; кавычки и переносы в промпте команду не ломают):
  #   {prompt_text} — текст готового промпта одним аргументом argv
  #   {prompt_file} — путь к файлу с промптом (для CLI, читающих файл)
  #   {model}       — значение из блока models для этапа (передаётся как есть)
  #   {out_file}    — целевой артефакт;  {workdir} — рабочий каталог
  # Третий способ передачи промпта — stdin: true (текст подаётся на stdin).
  #
  # Пусто = runner остановится с подсказкой ДО первого вызова.
  command: ""
  stdin: false
  timeout_sec: 1800
  # Если агент печатает метрики токенов в stdout — regex с одной группой
  # захвата числа; пусто = стоимость не считается.
  metrics_regex: '"total_tokens"\s*:\s*([0-9]+)'
  # Кросс-вендорная валидация: этапы 90 и 92 гоняет НЕ та модель/агент,
  # что этап 4. Runner останавливает прогон при совпадении команд.
  # Впишите команду ДРУГОГО вашего CLI-агента:
  by_stage:
    "90": ""
    "92": ""

# Соответствие этап -> модель. Значение подставляется в {model} команды
# агента КАК ЕСТЬ: пишите то, что понимает ваш CLI, — уровни (cheap/strong)
# или конкретные имена моделей вашего вендора. Маршрутизация по смыслу:
# этапы 0–4 и 89 — дешёвый уровень (экстракция, ошибки ловит код),
# 5–8 — старший (синтез), 90/92 — старший другого вендора.
models:
  "0": cheap      # инвентаризация — механика + чтение манифестов
  "1": cheap      # карта модуля
  "2": cheap      # доменная модель
  "3": cheap      # контракт интерфейса
  "4": cheap      # извлечение правил
  "5": strong     # синтез потоков
  "6": strong     # истории
  "7": strong     # SRS
  "8": strong     # финальный пакет (альтернатива 6+7)
  "89": cheap     # отработка инструкций документации
  "90": strong    # валидация — другой вендор (см. agent.by_stage)
  "92": strong    # инверсная верификация — другой вендор (см. agent.by_stage)

# Фильтр модулей для фан-аута этапов 1 и 4 (пути из inventory.modules).
module_filter:
  exclude:
    - "tests/*"
    - "test/*"
    - "**/tests/*"
    - "**/test_*.py"
    - "**/*_test.py"
    - "**/*_test.go"
    - "**/spec/*"
    - "**/vendor/*"
    - "**/node_modules/*"
    - "**/*_pb2.py"          # генерённый код protobuf
    - "**/*_pb2_grpc.py"
    - "**/migrations/*"
    - "**/.venv/*"
  min_lines: 0               # модули короче — пропускаются (0 = не фильтровать)

thresholds:
  stage90_confirmed_pct: 97  # порог приёмки прогона (доля ПОДТВЕРЖДЕНО)

retries: 2                   # ретраев на задачу; дальше — эскалация

# Ярусная глубина реверса по каталогам/capability.
#   L0 — этапы 0–1 (оглавление системы, дёшево; умолчание вне карты)
#   L1 — + этапы 2–3 (зоны интеграций)
#   L2 — полный прогон (горячие capability)
# Без секции tiers всё идёт как L2 (поведение базовой постановки).
# Поднять зону по требованию: runner.py --raise-tier <путь> <ярус>
# (поднятия хранятся в workspace/tiers.yaml поверх этой карты).
# Пример (раскомментируйте и подставьте свои зоны):
# tiers:
#   default: L0
#   map:
#     - path: "src/payments/"
#       tier: L2
#     - path: "src/integration/"
#       tier: L1

validation:
  # Этап 92: инверсная верификация — по формулировкам предсказывается код,
  # предсказание механически сверяется с фактом (checks/inverse_match.py).
  # Только статистика: пороги приёмки в v3 не калибруются (v3.1).
  inverse: false
